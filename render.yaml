services:
  # Spring Boot Backend Service
  - type: web
    name: intervue-backend
    env: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/intervueai-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: intervue-db
          property: connectionString
      - key: NVIDIA_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # React Frontend Static Site
  - type: web
    name: intervue-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: intervue-backend
          property: url

databases:
  - name: intervue-db
    databaseName: intervue_ai
    user: intervue_user
